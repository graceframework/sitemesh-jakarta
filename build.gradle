plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
}

ext {
    isBuildSnapshot = version.endsWith("-SNAPSHOT")
    isReleaseVersion = !isBuildSnapshot
}

ext."signing.keyId" = System.getenv("SIGNING_KEY") ?: project.hasProperty("signing.keyId") ? project.getProperty('signing.keyId') : null
ext."signing.password" = System.getenv("SIGNING_PASSPHRASE") ?: project.hasProperty("signing.password") ? project.getProperty('signing.password') : null
ext."signing.secretKeyRingFile" = project.hasProperty("signing.secretKeyRingFile") ? project.getProperty('signing.secretKeyRingFile') : null

group = 'org.graceframework.opensymphony'

repositories {
    mavenCentral()
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
    withJavadocJar()
}

configurations {
    lexer
}

sourceSets.main.java.srcDirs += ['build/generated-sources/jflex']

javadoc {
    failOnError = false
    exclude '**/Lexer.java'
}

jar {
    from('src/main/java') {
        include '**/*.xml'
    }
}

dependencies {
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'

    testImplementation 'junit:junit:4.5'

    lexer 'de.jflex:jflex:1.3.5'
}

// Generate Lexer.java from JFlex before compiling Java
tasks.named('compileJava').configure {
    doFirst {
        ant.taskdef classname: 'JFlex.anttask.JFlexTask', name: 'jflex', classpath: configurations.lexer.asPath
        ant.jflex(
            file: 'src/main/java/com/opensymphony/module/sitemesh/html/tokenizer/lexer.flex',
            destdir: 'build/generated-sources/jflex'
        )
    }
}

tasks.withType(Sign) {
    onlyIf { isReleaseVersion }
}

afterEvaluate {
    signing {
        required = isReleaseVersion && gradle.taskGraph.hasTask("publish")
        sign publishing.publications.mavenJava
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components.java)
            pom {
                name = 'Sitemesh'
                description = 'SiteMesh is a web-page layout and decoration framework and web-application integration framework to aid in creating large sites consisting of many pages for which a consistent look/feel, navigation and layout scheme is required.'
                url = 'https://github.com/graceframework/sitemesh-jakarta'
                licenses {
                    license {
                        name =  'The Apache Software License, Version 1.1'
                        url = 'https://raw.githubusercontent.com/graceframework/sitemesh-jakarta/2.6.x/LICENSE.txt'
                        distribution =  'repo'
                    }
                }
                developers {
                    developer {
                        id = 'joewalnes'
                        name = 'Joe Walnes'
                        email = 'joe dot walnes at gmail'
                    }
                    developer {
                        id = 'codeconsole'
                        name = 'Scott Murphy'
                    }
                }
                organization {
                    name = 'Grace Framework'
                }
                scm {
                    connection = 'scm:git:git://github.com/graceframework/sitemesh-jakarta.git'
                    developerConnection = 'scm:git:git@github.com:sitemesh/sitemesh-jakarta.git'
                    url = 'https://github.com/graceframework/sitemesh-jakarta/'
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/graceframework/sitemesh-jakarta/issues'
                }
            }
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            def mavenUser = System.getenv("MAVEN_CENTRAL_USER") ?: project.hasProperty("mavenCentralUsername") ? project.mavenCentralUsername : ''
            def mavenPass = System.getenv("MAVEN_CENTRAL_PASSWORD") ?: project.hasProperty("mavenCentralPassword") ? project.mavenCentralPassword : ''
            nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
            snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")
            username = mavenUser
            password = mavenPass
        }
    }
}
